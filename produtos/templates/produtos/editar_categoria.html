
{% extends 'base.html' %}

{% block title %}
Editar Categoria - Sistema Agro
{% endblock %}

{% block content %}

<div class="editar-categoria-container">

    <h1>Editar Categoria</h1>

    <form method="POST">

        {% csrf_token %}
        {% if erro %}
            <div class="mensagem-erro">
                {{ erro }}
            </div>
        {% endif %}
        <div class="campo-formulario">

            <label for="nome">
                Nome da categoria:
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ categoria.nome }}"
                required
            >

        </div>


        <div class="campo-formulario">

            <label for="descricao">
                Descrição:
            </label>

            <textarea
                id="descricao"
                name="descricao"
                rows="5"
                required
            >{{ categoria.descricao }}</textarea>

        </div>


        <div class="editar-acoes">

            <button
                type="submit"
                class="btn-salvar"
            >
                Salvar alterações
            </button>

            <a
                href="{% url 'lista_categorias' %}"
                class="btn-cancelar"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
