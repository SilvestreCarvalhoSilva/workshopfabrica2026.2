 
{% extends 'base.html' %}

{% block title %}
Cadastrar Categoria - Sistema Agro
{% endblock %}

{% block content %}

<div class="formulario-container">

    <h1>Cadastrar Categoria</h1>

    <p>
        Cadastre uma nova categoria para seus produtos agropecuários.
    </p>

    <form method="POST">

        {% csrf_token %}

        {% if erro %}
            <div class="mensagem-erro">
                {{ erro }}
            </div>
        {% endif %}

        <div class="campo">

            <label for="nome">
                Nome da categoria
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: Rações"
                required
            >

        </div>

        <div class="campo">

            <label for="descricao">
                Descrição
            </label>

            <textarea
                id="descricao"
                name="descricao"
                placeholder="Digite uma descrição para a categoria"
                rows="5"
            ></textarea>

        </div>

        <div class="acoes-formulario">

            <a
                href="{% url 'lista_produtos' %}"
                class="botao"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="botao botao-adicionar"
            >
                Cadastrar Categoria
            </button>

        </div>

    </form>

</div>

{% endblock %}
